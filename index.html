<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シネマ半券帳</title>
<meta name="theme-color" content="#b3122e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, a personal film diary kept by a regular cinema-goer
   IDEA the box of torn ticket stubs you keep after each screening
   PICTURE each review is a ticket stub with perforation and punched stars; recs are tickets for films still to come
   COLOUR theatre-curtain red ground band, paper white stubs, ink near-black, gold seat-number accent
   TYPE Dela Gothic One for poster lettering + Zen Kaku Gothic New
   LAYOUT red band with title and counts, tabs, then the stub list; phone stacks one column */
:root{color-scheme:light dark;--bg:light-dark(#fbf7f5,#151012);--ink:light-dark(#1c1416,#f3ecec);--sub:light-dark(#6d5d60,#b7a8ab);--red:#b3122e;--red2:light-dark(#8e0d24,#7d0b20);--paper:light-dark(#ffffff,#221a1c);--line:light-dark(#e6dadb,#3a2e31);--gold:light-dark(#a86f00,#e6b84a);--chip:light-dark(#f4eaeb,#2d2326)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
.top{background:var(--red);color:#fff;padding:22px max(4vw,16px) 0;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.13) 0 14px,rgba(255,255,255,0) 14px 34px)}
.top .in{max-width:980px;margin:0 auto}
h1{font:400 clamp(32px,7vw,48px)/1.05 "Dela Gothic One",sans-serif;margin:0;letter-spacing:-.01em}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:12px 0 16px;font-size:14px}
.stats b{font:400 26px/1 "Dela Gothic One",sans-serif;margin-right:4px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;max-width:180px;border:0;background:rgba(255,255,255,.16);color:#fff;padding:12px 8px;border-radius:12px 12px 0 0;font-weight:700;cursor:pointer;min-height:46px}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:18px max(4vw,16px) 60px}
.note{font-size:13px;color:var(--sub);margin:6px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{border:1.5px solid var(--red);background:var(--red);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--red)}
:root[data-theme=dark] .btn.ghost{color:#ff8a9c;border-color:#ff8a9c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.ghost{color:#ff8a9c;border-color:#ff8a9c}}
.btn:focus-visible,.tabs button:focus-visible,.chip:focus-visible,.star:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 14px;cursor:pointer;min-height:42px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.stub{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 92px;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.stub::before,.stub::after{content:"";position:absolute;right:83px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub.rec::before,.stub.rec::after{right:83px}.stub::before{top:-10px}.stub::after{bottom:-10px}
.stub .main{padding:14px 16px;border-right:2px dashed var(--line);cursor:pointer}
.stub .side{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;text-align:center}
.stub .side .big{font:400 30px/1 "Dela Gothic One",sans-serif;color:var(--red)}
:root[data-theme=dark] .stub .side .big{color:#ff8a9c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .stub .side .big{color:#ff8a9c}}
.stub .side small{font-size:12px;color:var(--sub)}
.stub h3{margin:0;font-size:18px;line-height:1.35}
.meta{font-size:13px;color:var(--sub);margin-top:2px}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.txt{margin:8px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;background:var(--chip);border-radius:999px;padding:2px 9px}
.why{font-size:13.5px;margin-top:8px;color:var(--ink)}
.why li{margin:2px 0}
.why ul{margin:0;padding-left:1.1em}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.b-now{background:var(--red);color:#fff}
.b-soon{background:var(--gold);color:#fff}
:root[data-theme=dark] .b-soon{color:#1c1416}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;min-height:38px;font-size:14px}
.acts .btn{background:var(--red);color:#fff;border:1.5px solid var(--red);padding:10px 22px;min-height:44px;font-weight:700;font-size:16px}
.acts .btn.ghost{background:transparent;color:var(--red)}
.acts .on{background:var(--gold);border-color:var(--gold);color:#fff}
form{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 4px}
label:first-child{margin-top:0}
input[type=text],input[type=date],textarea{width:100%;font-size:16px;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
input:focus,textarea:focus{outline:2px solid var(--red);border-color:var(--red)}
textarea{min-height:120px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.rate{display:flex;gap:2px}
.star{border:0;background:transparent;font-size:34px;line-height:1;color:var(--line);cursor:pointer;width:46px;height:46px;padding:0}
.star.on{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;min-height:38px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:13px;color:var(--sub);margin-top:4px}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
.ai{border:1.5px solid var(--gold);border-radius:12px;padding:14px 16px;margin:6px 0 18px;background:var(--paper)}
.ai h2,h2{font-size:18px;margin:4px 0 8px}
.ai ol{margin:0;padding-left:1.3em}
.ai li{margin:6px 0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:-4px 0 14px;font-size:14px}
.me label{font-weight:700}
.me input{width:9em;font-size:16px;border:0;border-radius:8px;padding:6px 10px;background:rgba(255,255,255,.92);color:#1c1416}
.btn.small{min-height:36px;padding:5px 14px;background:#fff;color:var(--red);border-color:#fff}
.who{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;vertical-align:1px}
.w-me{background:var(--red);color:#fff}
.w-pt{background:#2f6f6a;color:#fff}
.pair{font-size:13.5px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ptxt{color:var(--sub)}
.stub.rec{grid-template-columns:auto minmax(0,1fr) 92px}
.poster{width:78px;height:117px;object-fit:cover;border-radius:6px;margin:14px 0 14px 14px;background:var(--chip)}
.login{max-width:420px;margin:40px auto;padding:0 16px}
.login form{margin-top:16px}
details summary{cursor:pointer;margin:10px 0;font-weight:700}
.msg{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
footer{max-width:980px;margin:0 auto;padding:0 max(4vw,16px) 40px;font-size:13px;color:var(--sub)}
@media(max-width:600px){.stub.rec{grid-template-columns:auto minmax(0,1fr) 64px}.poster{width:56px;height:84px;margin:14px 0 0 12px}}
[hidden]{display:none!important}
@media(max-width:600px){.stub{grid-template-columns:minmax(0,1fr) 74px}.stub::before,.stub::after{right:65px}.stub.rec::before,.stub.rec::after{right:55px}.stub .side .big{font-size:24px}.row2{grid-template-columns:minmax(0,1fr)}.tabs button{font-size:14px}}
@media(prefers-reduced-motion:no-preference){.stub{animation:in .25s ease-out both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<section id="login" class="login" hidden>
<h1 style="color:var(--red)">シネマ半券帳</h1>
<p class="note" id="keyNote" hidden>ふたり専用のリンク（末尾に ?k= が付いたURL）から一度開いてください。以後はこの端末で普通に開けます。</p>
<p class="note" id="setupNote" hidden>config.js の設定がまだです。README の手順で Supabase の値を入れてください。</p>
<form id="loginForm" novalidate>
<label>どちらが使いますか</label>
<div class="chips" id="whoPick"></div>
<p class="hint" id="loginErr" role="alert"></p>
<div class="acts"><button type="submit" class="btn">はじめる</button></div>
</form>
</section>
<div id="app" hidden>
<header class="top"><div class="in">
<h1>シネマ半券帳</h1>
<div class="stats" id="stats"></div>
<div class="me" id="meRow"></div>
<div class="tabs" role="tablist">
<button role="tab" id="t-log" aria-selected="true">鑑賞記録</button>
<button role="tab" id="t-rec" aria-selected="false">おすすめ</button>
<button role="tab" id="t-want" aria-selected="false">観たい</button>
</div>
</div></header>
<main>
<p class="msg" id="msg" hidden></p>
<section id="v-log">
<div class="bar"><button class="btn" id="newBtn">＋ 感想を書く</button><input type="text" id="q" placeholder="記録を検索" style="flex:1;max-width:280px" aria-label="記録を検索"><div class="seg" id="whoSeg"></div></div>
<form id="f" hidden novalidate>
<label for="fTitle">作品名</label>
<input type="text" id="fTitle" list="dl" autocomplete="off" required placeholder="例：ゴジラ-0.0">
<datalist id="dl"></datalist>
<div class="hint" id="fMatch"></div>
<div class="row2">
<div><label for="fDate">鑑賞日</label><input type="date" id="fDate" required></div>
<div><label for="fPlace">劇場・スクリーン</label><input type="text" id="fPlace" placeholder="例：TOHOシネマズ IMAX"></div>
</div>
<label>評価</label>
<div class="rate" id="fRate"></div>
<label>ジャンル</label>
<div class="chips" id="fGenres"></div>
<label for="fPeople">監督・出演（読点区切り）</label>
<input type="text" id="fPeople" placeholder="例：山崎貴、神木隆之介">
<label for="fText">感想</label>
<textarea id="fText" placeholder="良かったところ、気になったところ"></textarea>
<div class="acts"><button type="submit" class="btn">保存</button><button type="button" class="btn ghost" id="cancel">やめる</button></div>
</form>
<p class="note" id="sampleNote" hidden>いま表示しているのはサンプルです。最初の感想を保存すると消えます。</p>
<div id="list"></div>
</section>
<section id="v-rec" hidden>
<div class="bar">
<div class="seg" id="recSeg"><button data-f="all" aria-pressed="true">すべて</button><button data-f="now" aria-pressed="false">上映中</button><button data-f="soon" aria-pressed="false">公開予定</button></div>
<div class="seg" id="modeSeg"><button data-m="both" aria-pressed="true">ふたりで</button><button data-m="me" aria-pressed="false">自分向け</button></div>
</div>
<p class="note" id="recNote"></p>
<div id="recs"></div>
</section>
<section id="v-want" hidden><div id="wants"></div></section>
</main>
<footer>作品情報・ポスター画像は TMDB API を利用しています（This product uses the TMDB API but is not endorsed or certified by TMDB.）</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
